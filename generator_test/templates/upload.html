<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>MATHutrice — Upload PDF</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --purple-dark:#542365;
      --purple-light:#8c52f0;
      --pink-soft:#f8abe0;
      --pink-hot:#cb0a67;
      --white:#ffffff;
      --text-dark:#1a0a20;
      --text-muted:#7a5a85;
      --border:rgba(84,35,101,0.12);
      --shadow:0 10px 28px rgba(84,35,101,0.16);
      --radius:18px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      min-height:100vh;
      font-family:'Poppins',sans-serif;
      color:var(--text-dark);
      background:
        radial-gradient(circle at top right,rgba(248,171,224,0.22),transparent 24%),
        radial-gradient(circle at left bottom,rgba(140,82,240,0.14),transparent 30%),
        linear-gradient(135deg,var(--purple-dark) 0%,var(--pink-hot) 55%,var(--purple-light) 100%);
    }
    .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
    .upload-shell{width:100%;max-width:700px;position:relative;}
    .header{display:flex;align-items:center;gap:12px;margin-bottom:30px;}
    .back-btn{
      width:44px;height:44px;border-radius:12px;border:none;cursor:pointer;
      background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.22);
      color:white;display:flex;align-items:center;justify-content:center;
      transition:transform 0.2s,background 0.2s;text-decoration:none;
      font-size:18px;
    }
    .back-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,0.28);}
    .title{color:white;font-size:36px;font-weight:800;line-height:1.1;flex:1;}
    .upload-card{background:rgba(255,255,255,0.96);border-radius:var(--radius);padding:40px;box-shadow:var(--shadow);backdrop-filter:blur(10px);}

    /* Onglets */
    .tabs{display:flex;gap:8px;margin-bottom:28px;border-bottom:2px solid var(--border);padding-bottom:0;}
    .tab{
      padding:10px 20px;border:none;background:none;font-family:'Poppins',sans-serif;
      font-size:14px;font-weight:600;color:var(--text-muted);cursor:pointer;
      border-bottom:3px solid transparent;margin-bottom:-2px;transition:all 0.2s;
    }
    .tab:hover{color:var(--purple-dark);}
    .tab.active{color:var(--purple-dark);border-bottom-color:var(--purple-light);}
    .tab-content{display:none;}
    .tab-content.active{display:block;}

    .card-title{font-size:20px;font-weight:700;color:var(--purple-dark);margin-bottom:8px;}
    .card-subtitle{font-size:14px;color:var(--text-muted);margin-bottom:28px;}
    .drop-zone{
      border:2px dashed var(--purple-light);border-radius:16px;padding:50px 30px;
      text-align:center;background:rgba(140,82,240,0.04);transition:all 0.25s;cursor:pointer;
    }
    .drop-zone:hover,.drop-zone.dragover{border-color:var(--pink-hot);background:rgba(203,10,103,0.06);}
    .drop-icon{
      width:64px;height:64px;margin:0 auto 16px;
      background:linear-gradient(135deg,var(--purple-light),var(--pink-hot));
      border-radius:50%;display:flex;align-items:center;justify-content:center;
    }
    .drop-icon svg{width:32px;height:32px;color:white;}
    .drop-text{font-size:16px;font-weight:600;color:var(--purple-dark);margin-bottom:6px;}
    .drop-hint{font-size:13px;color:var(--text-muted);}
    .drop-hint span{color:var(--purple-light);font-weight:600;text-decoration:underline;cursor:pointer;}
    #fileInput{display:none;}
    .files-list{margin-top:24px;display:flex;flex-direction:column;gap:12px;}
    .file-item{
      display:flex;align-items:center;gap:14px;padding:14px 18px;
      background:rgba(140,82,240,0.06);border-radius:12px;border:1px solid rgba(140,82,240,0.12);
    }
    .file-icon{
      width:40px;height:40px;background:linear-gradient(135deg,#e74c3c,#c0392b);
      border-radius:8px;display:flex;align-items:center;justify-content:center;
      color:white;font-size:11px;font-weight:700;flex-shrink:0;
    }
    .file-info{flex:1;min-width:0;}
    .file-name{font-size:14px;font-weight:600;color:var(--text-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .file-size{font-size:12px;color:var(--text-muted);}
    .file-uploader{font-size:11px;color:var(--purple-light);margin-top:2px;}
    .file-remove{
      width:32px;height:32px;border:none;border-radius:8px;
      background:rgba(231,76,60,0.1);color:#e74c3c;cursor:pointer;
      display:flex;align-items:center;justify-content:center;transition:background 0.2s;flex-shrink:0;
    }
    .file-remove:hover{background:rgba(231,76,60,0.2);}
    .upload-btn{
      margin-top:28px;width:100%;padding:16px 24px;border:none;border-radius:14px;
      font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;color:white;
      background:linear-gradient(135deg,var(--purple-light),var(--pink-hot));
      cursor:pointer;transition:transform 0.2s,opacity 0.2s;
      display:flex;align-items:center;justify-content:center;gap:10px;
    }
    .upload-btn:hover{transform:translateY(-2px);opacity:0.95;}
    .upload-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
    .message{margin-top:20px;padding:14px 18px;border-radius:12px;font-size:14px;font-weight:500;display:none;}
    .message.success{display:block;background:rgba(39,174,96,0.1);color:#27ae60;border:1px solid rgba(39,174,96,0.2);}
    .message.error{display:block;background:rgba(231,76,60,0.1);color:#e74c3c;border:1px solid rgba(231,76,60,0.2);}

    .docs-list{display:flex;flex-direction:column;gap:10px;}
    .doc-item{
      display:flex;align-items:center;gap:12px;padding:14px 16px;
      background:rgba(39,174,96,0.06);border-radius:12px;border:1px solid rgba(39,174,96,0.15);
    }
    .doc-icon{
      width:40px;height:40px;background:linear-gradient(135deg,#27ae60,#2ecc71);
      border-radius:8px;display:flex;align-items:center;justify-content:center;
      color:white;font-size:11px;font-weight:700;flex-shrink:0;
    }
    .empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px;}

    @media(max-width:600px){
      .page{padding:20px 14px;}
      .title{font-size:28px;}
      .upload-card{padding:28px 20px;}
      .drop-zone{padding:36px 20px;}
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="upload-shell">

      <div class="header">
        <a href="/" class="back-btn" aria-label="Retour" title="Retour accueil">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
            <path d="M15 19L8 12L15 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <h1 class="title">Importer des cours</h1>
        <!-- Arrêter l'impersonnation — visible pour tout le monde, inoffensif si pas en impersonate -->
        <a href="/impersonate/stop" class="back-btn" title="Arrêter l'impersonnation">🔴</a>
        <!-- Déconnexion -->
        <a href="/logout" class="back-btn" title="Se déconnecter">🚪</a>
      </div>

      <div class="upload-card">

        <div class="tabs">
          <button class="tab active" onclick="switchTab(event, 'upload')">⬆️ Uploader</button>
          <button class="tab" onclick="switchTab(event, 'files')">📁 Mes fichiers</button>
        </div>

        <!-- Onglet 1 : Upload -->
        <div class="tab-content active" id="tab-upload">
          <h2 class="card-title">Uploader des fichiers PDF</h2>
          <p class="card-subtitle">Les documents seront stockés et utilisés pour alimenter l'assistant pédagogique.</p>

          <div class="drop-zone" id="dropZone">
            <div class="drop-icon">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 16V7M12 7L8.5 10.5M12 7L15.5 10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 16.5V17C5 18.1046 5.89543 19 7 19H17C18.1046 19 19 18.1046 19 17V16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <p class="drop-text">Glissez vos fichiers PDF ici</p>
            <p class="drop-hint">ou <span id="browseBtn">parcourez vos fichiers</span></p>
          </div>

          <input type="file" id="fileInput" multiple accept=".pdf">
          <div class="files-list" id="filesList"></div>

          <button class="upload-btn" id="uploadBtn" disabled>
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
              <path d="M12 16V7M12 7L8.5 10.5M12 7L15.5 10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Uploader les fichiers
          </button>

          <div class="message" id="message"></div>
        </div>

        <!-- Onglet 2 : Mes fichiers -->
        <div class="tab-content" id="tab-files">
          <h2 class="card-title">Fichiers disponibles</h2>
          <p class="card-subtitle">Documents déjà chargés et disponibles pour l'assistant.</p>
          <div class="docs-list" id="docsList">
            <div class="empty-state">Chargement...</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // ── Onglets ──────────────────────────────────────────────────────
    function switchTab(e, tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      e.target.classList.add('active');
      if (tab === 'files') loadDocs();
    }

    // ── Chargement des docs ──────────────────────────────────────────
    async function loadDocs() {
      const list = document.getElementById('docsList');
      try {
        const res = await fetch('/upload/list');
        const data = await res.json();
        if (!data.files || data.files.length === 0) {
          list.innerHTML = '<div class="empty-state">Aucun fichier uploadé pour le moment.</div>';
          return;
        }
        list.innerHTML = data.files.map(f => `
          <div class="doc-item">
            <div class="doc-icon">PDF</div>
            <div class="file-info">
              <div class="file-name">${f.name}</div>
              <div class="file-size">${f.size} — ${f.date}</div>
              ${f.uploader ? `<div class="file-uploader">👤 ${f.uploader}</div>` : ''}
            </div>
          </div>
        `).join('');
      } catch (e) {
        list.innerHTML = '<div class="empty-state">Erreur lors du chargement.</div>';
      }
    }

    // ── Upload ───────────────────────────────────────────────────────
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const browseBtn = document.getElementById('browseBtn');
    const filesList = document.getElementById('filesList');
    const uploadBtn = document.getElementById('uploadBtn');
    const message = document.getElementById('message');

    let selectedFiles = [];

    browseBtn.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
    fileInput.addEventListener('change', () => handleFiles(fileInput.files));

    function handleFiles(files) {
      for (const file of files) {
        if (file.type === 'application/pdf' && !selectedFiles.find(f => f.name === file.name)) {
          selectedFiles.push(file);
        }
      }
      renderFilesList();
      updateUploadBtn();
    }

    function renderFilesList() {
      filesList.innerHTML = selectedFiles.map((file, idx) => `
        <div class="file-item">
          <div class="file-icon">PDF</div>
          <div class="file-info">
            <div class="file-name">${file.name}</div>
            <div class="file-size">${formatSize(file.size)}</div>
          </div>
          <button class="file-remove" onclick="removeFile(${idx})">
            <svg viewBox="0 0 24 24" fill="none" width="16" height="16">
              <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      `).join('');
    }

    function removeFile(idx) { selectedFiles.splice(idx, 1); renderFilesList(); updateUploadBtn(); }
    function updateUploadBtn() { uploadBtn.disabled = selectedFiles.length === 0; }
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
      return (bytes/(1024*1024)).toFixed(1) + ' MB';
    }

    uploadBtn.addEventListener('click', async () => {
      if (selectedFiles.length === 0) return;
      uploadBtn.disabled = true;
      uploadBtn.innerHTML = 'Upload en cours...';
      message.className = 'message';

      const formData = new FormData();
      selectedFiles.forEach(file => formData.append('files', file));

      try {
        const res = await fetch('/upload/pdf', { method: 'POST', body: formData });
        const data = await res.json();
        if (res.ok) {
          message.className = 'message success';
          message.textContent = data.message;
          selectedFiles = [];
          renderFilesList();
        } else {
          throw new Error(data.detail || 'Erreur upload');
        }
      } catch (e) {
        message.className = 'message error';
        message.textContent = e.message;
      }

      uploadBtn.disabled = false;
      uploadBtn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
          <path d="M12 16V7M12 7L8.5 10.5M12 7L15.5 10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Uploader les fichiers`;
      updateUploadBtn();
    });
  </script>
</body>
</html>
